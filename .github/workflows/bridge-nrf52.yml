name: Bridge nRF52 experimental build

# Builds the nRF52 targets of the bridge on working branches. It publishes nothing.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: bridge-nrf52-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1794528000"
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"
  PLATFORMIO_CORE_DIR: /tmp/bridge-platformio
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: [tracker-t1000-e, tracker-t1000-e-bitchat]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Install isolated build tools
        run: python -m pip install platformio==6.2.0 intelhex==2.3.0
      - name: Compile
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          set -o pipefail
          mkdir -p evidence
          pio run -e "$BRIDGE_ENV" 2>&1 | tee evidence/build.log
      - name: Report size
        if: always()
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          # Annotations can be read without downloading the log.
          grep -E "^(RAM|Flash):" evidence/build.log | while read -r line; do echo "::notice::$line"; done || true
          grep -E "error:|overflowed|undefined reference|Error [0-9]" evidence/build.log | head -9 |
            while read -r line; do echo "::error::$line"; done || true
          ls -la ".pio/build/$BRIDGE_ENV"/firmware* 2>/dev/null || true
      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nrf52-${{ matrix.environment }}
          if-no-files-found: warn
          path: |
            evidence/build.log
            .pio/build/${{ matrix.environment }}/firmware*.uf2
            .pio/build/${{ matrix.environment }}/firmware*.hex
            .pio/build/${{ matrix.environment }}/firmware*.zip
