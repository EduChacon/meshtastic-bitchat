name: Suspend prereleases with reported boot failure

on:
  push:
    branches: ["fix/heltec-boot-memory"]
    paths: [".github/workflows/bridge-release-notice.yml"]

permissions:
  contents: write

jobs:
  notice:
    if: github.repository == 'EduChacon/meshtastic-bitchat'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve artifacts and prepend known failure notice
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tag in v0.1.0-experimental v0.1.0-experimental.2; do
            gh release view "$tag" --json body --jq '.body' > /tmp/old-notes.md
            if rg -q 'BOOT-INCIDENT-2026-11-13' /tmp/old-notes.md; then
              continue
            fi
            cat > /tmp/notice.md <<'NOTICE'
          > [!WARNING]
          > **INSTALLATIONS SUSPENDED / INSTALAÇÕES SUSPENSAS — BOOT-INCIDENT-2026-11-13**
          > Version .2 stalled at boot on a Heltec V3 and reset through the task watchdog.
          > The earlier release shares the initialization code under investigation. Cardputer remains hardware-untested.
          > Do not install these packages. Do not erase flash to troubleshoot this failure.
          > A versão .2 travou no primeiro boot reportado no Heltec V3. Não instalar os pacotes existentes.
          > Preserve a private backup before any separately authorized recovery write.
          > [Investigation and recovery status](https://github.com/EduChacon/meshtastic-bitchat/blob/main/docs/bridge/BOOT_INCIDENT.md).

          Original release notes (historical; the warning above supersedes the installation status):

          NOTICE
            cat /tmp/notice.md /tmp/old-notes.md > /tmp/updated-notes.md
            gh release edit "$tag" --prerelease --latest=false --title "Suspended for boot investigation — $tag" --notes-file /tmp/updated-notes.md
          done
