name: Bridge verification and release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the version named in tools/bridge/package_release.py
        type: boolean
        default: false

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1794528000"
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"
  PLATFORMIO_CORE_DIR: /tmp/bridge-platformio
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        environment:
          [
            heltec-v3-bitchat,
            heltec-v4-bitchat,
            heltec-wsl-v3-bitchat,
            heltec-wireless-tracker-bitchat,
            heltec-wireless-paper-bitchat,
            tbeam-s3-core-bitchat,
            seeed-xiao-s3-bitchat,
            t-deck-bitchat,
            station-g2-bitchat,
            m5stack-cardputer-adv-bitchat,
          ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Install isolated build tools
        run: python -m pip install platformio==6.2.0 intelhex==2.3.0
      - name: Record provenance
        run: |
          mkdir -p evidence dist
          git rev-parse HEAD > evidence/commit.txt
          git submodule status --recursive > evidence/submodules.txt
          python --version > evidence/python.txt
          pio --version > evidence/platformio.txt
          python -m pip freeze > evidence/python-packages.txt
      - name: Compile application
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          set -o pipefail
          pio run -e "$BRIDGE_ENV" -t buildprog 2>&1 | tee evidence/build.log
      - name: Host and defensive artifact tests
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
          CXX: clang++
        run: |
          set -o pipefail
          python tools/bridge/test_host.py --crypto-dir ".pio/libdeps/$BRIDGE_ENV/Crypto" 2>&1 | tee evidence/host.log
          python tools/bridge/test_ble.py 2>&1 | tee evidence/ble-adapter.log
          python tools/bridge/test_memory.py 2>&1 | tee evidence/memory.log
          python tools/bridge/test_menu.py 2>&1 | tee evidence/menu.log
          python tools/bridge/test_defaults.py 2>&1 | tee evidence/defaults.log
          python tools/bridge/test_flow.py --crypto-dir ".pio/libdeps/$BRIDGE_ENV/Crypto" 2>&1 | tee evidence/flow.log
          python tools/bridge/test_startup.py --nimble-dir ".pio/libdeps/$BRIDGE_ENV/NimBLE-Arduino" 2>&1 | tee evidence/startup.log
          python -m unittest discover -s test/test_bitchat_bridge -p 'test_*.py' -v 2>&1 | tee evidence/packages.log
      - name: Static analysis
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          set -o pipefail
          pio check -e "$BRIDGE_ENV" --skip-packages --src-filters '+<src/bridge/>' --fail-on-defect high 2>&1 | tee evidence/cppcheck.log
      - name: Compare clean rebuild
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          set -o pipefail
          python tools/bridge/reproduce.py --environment "$BRIDGE_ENV" 2>&1 | tee evidence/reproduce.log
      - name: Compile without bridge flag
        if: matrix.environment == 'heltec-v3-bitchat'
        run: |
          set -o pipefail
          pio run -e heltec-v3 -t buildprog 2>&1 | tee evidence/stock-regression.log
      - name: Package application updates and source dependencies
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          python tools/bridge/package_release.py --environment "$BRIDGE_ENV"
          python tools/bridge/dependencies.py --environment "$BRIDGE_ENV"
          python tools/bridge/verify_artifact.py dist/meshtastic-bitchat-*.zip --model "${BRIDGE_ENV%-bitchat}" --package-only
          tar -czf "dist/debug-$BRIDGE_ENV-$GITHUB_SHA.tar.gz" .pio/build/"$BRIDGE_ENV"/*.elf .pio/build/"$BRIDGE_ENV"/*.map
          sha256sum "dist/debug-$BRIDGE_ENV-$GITHUB_SHA.tar.gz" > evidence/debug-symbols.sha256
      - name: Upload verified files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.environment }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      # The same environment again for each country of tools/bridge/regions.json: only the region a radio
      # that never had one starts with changes.
      - name: Package for each country
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          set -o pipefail
          for region in $(python tools/bridge/region_flags.py --list); do
            PLATFORMIO_BUILD_FLAGS="$(python tools/bridge/region_flags.py "$region")" \
              pio run -e "$BRIDGE_ENV" -t buildprog 2>&1 | tee "evidence/build-$region.log" | tail -4
            python tools/bridge/package_release.py --environment "$BRIDGE_ENV" --region "$region" --output "countries/$region"
            python tools/bridge/verify_artifact.py "countries/$region"/meshtastic-bitchat-*.zip --model "${BRIDGE_ENV%-bitchat}" --package-only
          done
      - name: Upload country files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: country-${{ matrix.environment }}
          path: countries/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.environment }}
          path: evidence/*
          if-no-files-found: warn
          retention-days: 30

  experimental:
    # A trial target outside the release checks: built and attached as it is, never tested on hardware.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BRIDGE_ENV: tracker-t1000-e-bitchat
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Install isolated build tools
        run: python -m pip install platformio==6.2.0 intelhex==2.3.0
      - name: Compile
        run: |
          set -o pipefail
          mkdir -p evidence experimental
          pio run -e "$BRIDGE_ENV" 2>&1 | tee evidence/build.log
          version="$(python -c 'import runpy; print(runpy.run_path("tools/bridge/package_release.py")["VERSION"])')"
          cp ".pio/build/$BRIDGE_ENV"/firmware-*.uf2 "experimental/EXPERIMENTAL-t1000-e-bitchat-$version.uf2"
          for region in $(python tools/bridge/region_flags.py --list); do
            PLATFORMIO_BUILD_FLAGS="$(python tools/bridge/region_flags.py "$region")" \
              pio run -e "$BRIDGE_ENV" 2>&1 | tee "evidence/build-$region.log" | tail -4
            cp ".pio/build/$BRIDGE_ENV"/firmware-*.uf2 \
              "experimental/EXPERIMENTAL-t1000-e-bitchat-$version-$(python tools/bridge/region_flags.py "$region" --slug).uf2"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: experimental-tracker-t1000-e
          path: experimental/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [verify, experimental]
    # Publishes only from main: by manual dispatch, or by a push whose last commit says [publish-release].
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-*
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: experimental-*
          merge-multiple: true
          path: experimental
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: country-*
          merge-multiple: true
          path: countries
      - name: Package corresponding project source and evidence
        run: |
          git archive --format=tar --prefix=meshtastic-bitchat/ HEAD > /tmp/project-source.tar
          mkdir -p /tmp/project-source
          tar -xf /tmp/project-source.tar -C /tmp/project-source
          cp -a protobufs/. /tmp/project-source/meshtastic-bitchat/protobufs/
          find /tmp/project-source -name .git -type f -delete
          tar -czf release/project-source.tar.gz -C /tmp/project-source meshtastic-bitchat
          tar -czf release/test-evidence.tar.gz evidence
          cp docs/bridge/INSTALL.md release/INSTALL.md
          cp README.md README.en.md release/
          cp tools/bridge/verify_artifact.py release/verify_artifact.py
          cp tools/bridge/prepare_flash.py release/prepare_flash.py
          cp docs/bridge/WINDOWS_RECOVERY.md release/WINDOWS_RECOVERY.md
          cd release
          sha256sum * > SHA256SUMS
      - name: Build the single installation ZIP and the technical package
        run: |
          version="$(python -c 'import runpy; print(runpy.run_path("tools/bridge/package_release.py")["VERSION"])')"
          mkdir -p technical/original-assets published
          python tools/bridge/bundle_release.py release --output published --version "$version"
          for region in $(python tools/bridge/region_flags.py --list); do
            python tools/bridge/bundle_release.py "countries/$region" --output published --version "$version" --region "$region"
          done
          cp release/* technical/original-assets/
          tar -czf "published/technical-package-$version.tar.gz" -C technical original-assets
          cp experimental/* published/
          cd published
          sha256sum * > SHA256SUMS
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import runpy; print(runpy.run_path("tools/bridge/package_release.py")["VERSION"])')"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha')"
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "Refusing to publish a superseded source commit."
            exit 1
          fi
          gh release create "v$version" published/* --target "$GITHUB_SHA" --prerelease --title "Bridge $version" --notes-file docs/bridge/RELEASE.md
