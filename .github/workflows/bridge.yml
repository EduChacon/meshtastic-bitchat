name: Bridge verification and experimental release

on:
  push:
    branches: [main, "integration/upstream-2.7.26"]
  workflow_dispatch:

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1794528000"
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"
  PLATFORMIO_CORE_DIR: /tmp/bridge-platformio
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment: [heltec-v3-bitchat, m5stack-cardputer-adv-bitchat]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Install isolated build tools
        run: python -m pip install platformio==6.2.0 intelhex==2.3.0
      - name: Record provenance
        run: |
          mkdir -p evidence dist
          git rev-parse HEAD > evidence/commit.txt
          git submodule status --recursive > evidence/submodules.txt
          python --version > evidence/python.txt
          pio --version > evidence/platformio.txt
          python -m pip freeze > evidence/python-packages.txt
      - name: Compile application
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          set -o pipefail
          pio run -e "$BRIDGE_ENV" -t buildprog 2>&1 | tee evidence/build.log
      - name: Host and defensive artifact tests
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
          CXX: clang++
        run: |
          set -o pipefail
          python tools/bridge/test_host.py --crypto-dir ".pio/libdeps/$BRIDGE_ENV/Crypto" 2>&1 | tee evidence/host.log
          python -m unittest discover -s test/test_bitchat_bridge -p 'test_*.py' -v 2>&1 | tee evidence/packages.log
      - name: Static analysis
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          set -o pipefail
          pio check -e "$BRIDGE_ENV" --skip-packages --src-filters '+<src/bridge/>' --fail-on-defect high 2>&1 | tee evidence/cppcheck.log
      - name: Compare clean rebuild
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          set -o pipefail
          python tools/bridge/reproduce.py --environment "$BRIDGE_ENV" 2>&1 | tee evidence/reproduce.log
      - name: Compile without bridge flag
        if: matrix.environment == 'heltec-v3-bitchat'
        run: |
          set -o pipefail
          pio run -e heltec-v3 -t buildprog 2>&1 | tee evidence/stock-regression.log
      - name: Package application updates and source dependencies
        env:
          BRIDGE_ENV: ${{ matrix.environment }}
        run: |
          python tools/bridge/package_release.py --environment "$BRIDGE_ENV"
          python tools/bridge/dependencies.py --environment "$BRIDGE_ENV"
          python tools/bridge/verify_artifact.py dist/meshtastic-bitchat-*.zip --model "${BRIDGE_ENV%-bitchat}" --package-only
      - name: Upload verified files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.environment }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.environment }}
          path: evidence/*
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-*
          path: evidence
      - name: Package corresponding project source and evidence
        run: |
          git archive --format=tar --prefix=meshtastic-bitchat/ HEAD > /tmp/project-source.tar
          mkdir -p /tmp/project-source
          tar -xf /tmp/project-source.tar -C /tmp/project-source
          cp -a protobufs/. /tmp/project-source/meshtastic-bitchat/protobufs/
          find /tmp/project-source -name .git -type f -delete
          tar -czf release/project-source.tar.gz -C /tmp/project-source meshtastic-bitchat
          tar -czf release/test-evidence.tar.gz evidence
          cp docs/bridge/INSTALL.md release/INSTALL.md
          cp README.md README.en.md release/
          cp tools/bridge/verify_artifact.py release/verify_artifact.py
          cd release
          sha256sum * > SHA256SUMS
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c 'import runpy; print(runpy.run_path("tools/bridge/package_release.py")["VERSION"])')"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "Refusing to publish a superseded main commit."
            exit 1
          fi
          gh release create "v$version" release/* --target "$GITHUB_SHA" --prerelease --title "Bridge $version — hardware untested" --notes-file docs/bridge/RELEASE.md
