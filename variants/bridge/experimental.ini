; Targets built for trial only. They are not part of the release, its packaging or its checks.
; nRF52: the bridge's ESP32 link code compiles against src/bridge/nrf52, a thin layer over Bluefruit.
[env:tracker-t1000-e-bitchat]
extends = env:tracker-t1000-e
build_flags =
  ${env:tracker-t1000-e.build_flags}
  -Isrc/bridge/nrf52
  -DMESHTASTIC_ENABLE_BITCHAT=1
  -DBITCHAT_HISTORY_ENTRIES=8
board_build.ldscript = variants/bridge/nrf52840_s140_v7_bridge.ld
