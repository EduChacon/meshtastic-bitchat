[env:heltec-v3-bitchat]
extends = env:heltec-v3
build_flags =
  ${env:heltec-v3.build_flags}
  -DMESHTASTIC_ENABLE_BITCHAT=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DDEBUG_MUTE=1

[env:m5stack-cardputer-adv-bitchat]
extends = env:m5stack-cardputer-adv
build_flags =
  ${env:m5stack-cardputer-adv.build_flags}
  -DMESHTASTIC_ENABLE_BITCHAT=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DDEBUG_MUTE=1
